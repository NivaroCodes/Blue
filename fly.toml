# Owner must replace the globally unique app name and review the region before deployment.
app = "blue-demo-replace-me"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 240

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "python run.py init-db"
  strategy = "rolling"

[env]
  HOST = "0.0.0.0"
  PORT = "8000"
  PRODUCTION = "1"
  RELOAD = "false"
  INLINE_ANALYSIS = "0"
  MEDIA_STORAGE = "r2"
  DB_POOL_SIZE = "2"
  DB_MAX_OVERFLOW = "0"
  DB_POOL_TIMEOUT = "10"
  DB_POOL_RECYCLE = "300"
  WORKER_THROTTLE_SECONDS = "4.5"

[processes]
  api = "python run.py api"
  worker = "python run.py worker"

[http_service]
  internal_port = 8000
  force_https = true
  processes = ["api"]
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  processes = ["api", "worker"]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[[restart]]
  processes = ["api", "worker"]
  policy = "always"
